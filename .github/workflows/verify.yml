name: Verify

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check pull request branch direction
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          case "$BASE_REF:$HEAD_REF" in
            develop:feature/*|develop:hotfix/*|main:develop|main:hotfix/*)
              echo "Allowed PR direction: $HEAD_REF -> $BASE_REF"
              ;;
            *)
              echo "::error::Disallowed PR direction: $HEAD_REF -> $BASE_REF"
              echo "Use feature/* -> develop, hotfix/* -> main/develop, or develop -> main."
              exit 1
              ;;
          esac
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check formatting
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Type-check and build
        run: pnpm exec tsc --build
      - name: Test
        run: pnpm test
